# Microsoft Copilot Studio Workflow — Compliance Document Validation
# Template: cliagent-workflow-1.0.0
# Price: $79–$99 · Complexity: Advanced · Connectors: Standard only
# Pairs with: legal-compliance-agent.yaml
#
# Import note: This YAML is an AgentSchema-aligned workflow specification.
# Copilot Studio currently imports workflows via unmanaged solution .zip or
# the visual designer. Use this file as the build blueprint, then export the
# resulting workflow as a solution for distribution.

kind: BotDefinition
components:
  - kind: BotSettingsComponent
    settings:
      kind: DefaultFeedbackCollection

  - kind: KnowledgeSourceComponent
    displayName: Compliance-Policy-Library
    description: |
      Provides access to the compliance policy and standards library used by
      the validation workflow to extract applicable guidelines and score
      document violations.
    configuration:
      kind: KnowledgeSourceConfiguration
      source:
        kind: SharePointKnowledgeSource
        siteUrl: https://<COMPANY>.sharepoint.com/sites/Compliance
        targetKind: Site

entity:
  kind: BotEntity
  displayName: Compliance Document Validation Workflow
  teamsAppInformation:
    kind: ApplicationDetails
    teams:
      kind: TeamsApplicationDetails
      lobDisplayName: Compliance Document Validation
      shortDescription: AI validation of uploaded documents against policy, with legal review and audit trail.
      longDescription: |
        Detects documents uploaded to the compliance intake library or submitted
        in chat, extracts the applicable guidelines, validates content against
        policy, and categorizes violations by risk. High-risk findings go to a
        human legal review stage via Teams adaptive card approval; medium-risk
        items generate remediation tasks; every decision lands in a full audit
        trail on SharePoint.
      accentColor: "#8c1d1d"
  configuration:
    kind: BotConfiguration
    channels:
      - kind: ChannelDefinition
        id: Microsoft365Copilot
        channelId: Microsoft365Copilot
      - kind: ChannelDefinition
        id: MsTeams
        channelId: MsTeams
    recognizer:
      kind: CLICopilotRecognizer
    agentSettings:
      kind: AgentSettings
      version: "1.0"
      model:
        series: gpt-4o
      instructions:
        segments:
          - kind: StaticSegment
            value: |-
              # Purpose
              You are the conversational interface for the Compliance Document
              Validation workflow. Users can submit a document for validation,
              ask why a document was flagged, check the status of a legal
              review, or request the audit trail for a completed validation.

              # General Guidelines
              - Use only data surfaced by the connected workflow runs and the
                Compliance audit log.
              - Do not invent risk levels, reviewer names, or violation counts.
              - For remediation status, reference the audit log and the
                remediation tasks list.
              - When asked about a policy, ground answers in the Compliance
                Policy Library knowledge source.

              # Response Format
              - **Document:** file name / document type
              - **Risk level:** High / Medium / Low
              - **Status:** Validated / Pending Legal Review / Remediating / Returned / Approved
              - **Reviewer:** name or "none"
              - **Audit reference:** audit log entry ID
      enableMemory: true
      web:
        kind: WebSettings
        enableWebSearch: false
  publishedOn: 2026-09-02T00:00:00Z
  synchronizationStatus:
    kind: BotSynchronizationDetails
    contentVersion: 2
  template: cliagent-workflow-1.0.0

environmentVariables:
  - kind: EnvironmentVariableDefinition
    displayName: Compliance SharePoint Site URL
    schemaName: compliance_SiteUrl
    type: String
    defaultValue: https://<COMPANY>.sharepoint.com/sites/Compliance
    description: SharePoint site containing the intake library, policy library, and audit log.

  - kind: EnvironmentVariableDefinition
    displayName: Intake Library Name
    schemaName: compliance_IntakeLibraryName
    type: String
    defaultValue: Compliance Intake
    description: Document library where documents for validation are uploaded.

  - kind: EnvironmentVariableDefinition
    displayName: Policy Library Name
    schemaName: compliance_PolicyLibraryName
    type: String
    defaultValue: Policies & Standards
    description: Document library containing the guidelines used for validation.

  - kind: EnvironmentVariableDefinition
    displayName: Audit Log List Name
    schemaName: compliance_AuditListName
    type: String
    defaultValue: Validation Audit Log
    description: SharePoint list capturing the full audit trail of every validation.

  - kind: EnvironmentVariableDefinition
    displayName: Remediation Tasks List Name
    schemaName: compliance_RemediationListName
    type: String
    defaultValue: Remediation Tasks
    description: SharePoint list where remediation tasks are created.

  - kind: EnvironmentVariableDefinition
    displayName: Legal Reviewer Email
    schemaName: compliance_LegalReviewerEmail
    type: String
    defaultValue: legal@<COMPANY>.com
    description: Legal/compliance reviewer assigned to high-risk items.

  - kind: EnvironmentVariableDefinition
    displayName: Remediation Owner Email
    schemaName: compliance_RemediationOwnerEmail
    type: String
    defaultValue: compliance-ops@<COMPANY>.com
    description: Owner notified when a remediation task is created.

  - kind: EnvironmentVariableDefinition
    displayName: High Risk Threshold Score
    schemaName: compliance_RiskThreshold
    type: Number
    defaultValue: "50"
    description: Risk score at or above which human legal review is always required.

  - kind: EnvironmentVariableDefinition
    displayName: Teams Team ID
    schemaName: compliance_TeamsTeamId
    type: String
    defaultValue: <TEAMS_TEAM_ID>
    description: Teams team containing the compliance notification channel.

  - kind: EnvironmentVariableDefinition
    displayName: Teams Channel ID
    schemaName: compliance_TeamsChannelId
    type: String
    defaultValue: <TEAMS_CHANNEL_ID>
    description: Teams channel where validation and review alerts are posted.

connectionReferences:
  - kind: ConnectionReference
    displayName: SharePoint Online
    schemaName: compliance_SharePointConnection
    connectorId: /providers/Microsoft.PowerApps/apis/shared_sharepointonline
    description: Connection to intake, policy, audit, and remediation lists.

  - kind: ConnectionReference
    displayName: Exchange Online
    schemaName: compliance_OutlookConnection
    connectorId: /providers/Microsoft.PowerApps/apis/shared_office365
    description: Connection used for legal review and remediation notifications.

  - kind: ConnectionReference
    displayName: Microsoft Teams
    schemaName: compliance_TeamsConnection
    connectorId: /providers/Microsoft.PowerApps/apis/shared_teams
    description: Connection used to post validation alerts and review requests.

flows:
  - kind: WorkflowDefinition
    id: compliance-document-validate
    displayName: Compliance — Document Validation
    description: Triggered when a document is uploaded to the Compliance Intake library (or submitted via agent conversation). Extracts guidelines, validates, categorizes risk, routes to legal or remediation, and writes the audit trail.
    status: Active
    trigger:
      kind: ConnectorTrigger
      type: Event
      displayName: When a file is created in Compliance Intake
      connector: sharepointonline
      operation: WhenFileCreated
      connectionReference: compliance_SharePointConnection
      inputs:
        siteAddress: "@{environmentVariables('compliance_SiteUrl')}"
        folderId: /Compliance Intake
      outputs:
        id: string
        name: string
        path: string
        contentBytes: string
        contentType: string
        createdDate: dateTime
        owner: string

    variables:
      - name: documentName
        type: String
        default: ""
      - name: findings
        type: String
        default: "[]"
      - name: riskLevel
        type: String
        default: Medium
      - name: auditStatus
        type: String
        default: Validated
      - name: auditEntry
        type: Object
        default: {}

    actions:
      - kind: SetVariableAction
        name: Capture document name
        inputs:
          variable: documentName
          value: "@{triggerOutputs()?['name']}"

      - kind: ConnectorAction
        name: Get policy guideline titles
        connector: sharepointonline
        operation: GetItems
        connectionReference: compliance_SharePointConnection
        inputs:
          siteAddress: "@{environmentVariables('compliance_SiteUrl')}"
          listName: "@{environmentVariables('compliance_PolicyLibraryName')}"
          top: 100

      - kind: PromptAction
        name: Extract and validate against policies
        model: gpt-4o
        prompt: |-
          You are a compliance validation engine. Compare the uploaded document
          against the applicable policy guidelines.

          Applicable guidelines (titles from the policy library):
          @{join(map(outputs('Get policy guideline titles')?['body']?['value'], lambda(item, item?['Title'])), '; ')}

          Document name: @{variables('documentName')}
          Document content:
          @{substring(triggerOutputs()?['contentBytes'], 0, min(length(triggerOutputs()?['contentBytes']), 6000))}

          Return a JSON array of findings. Each finding must have:
          - policy (guideline title or "None")
          - clause (relevant clause, or null)
          - summary (what appears to violate the guideline, or "Compliant")
          - riskScore (0–100 integer)

          Only return the JSON array, nothing else.
        output:
          name: findings
          type: String
        onFailure: Continue
        fallbackValue: "[]"

      - kind: AIClassifyAction
        name: Assess overall risk level
        model: gpt-4o
        prompt: |-
          Based on the extracted findings, classify the overall document risk
          into exactly one label: Low, Medium, or High.

          Rules:
          - High: one or more findings at riskScore >= @{environmentVariables('compliance_RiskThreshold')},
            suspected PII/PHI exposure, contract or regulatory breach.
          - Medium: findings present but below the threshold; corrections needed.
          - Low: no material findings; document is largely compliant.

          Findings: @{variables('findings')}
          Respond with ONLY the label.
        output:
          name: riskLevel
          type: String
          expectedValues: [Low, Medium, High]
        onFailure: Continue
        fallbackValue: Medium

      - kind: SetVariableAction
        name: Store risk level
        inputs:
          variable: riskLevel
          value: "@{outputs('Assess overall risk level')?['riskLevel']}"

      - kind: ConditionAction
        name: Is high risk?
        condition:
          operator: equals
          left: "@{variables('riskLevel')}"
          right: High
        trueBranch:
          - kind: SetVariableAction
            name: Mark pending legal review
            inputs:
              variable: auditStatus
              value: Pending Legal Review

          - kind: RFIAction
            name: Request legal review
            inputs:
              type: HumanApproval
              title: "Legal review required — @{variables('documentName')}"
              instructions: |-
                Review the flagged document and its AI findings. Approve the
                risk assessment, or reject with remediation instructions.
                Findings: @{variables('findings')}
              assigneeEmail: "@{environmentVariables('compliance_LegalReviewerEmail')}"
            outputs:
              decision: String
              comments: String
            onFailure: Continue
            fallbackValue: Rejected

          - kind: ConnectorAction
            name: Alert legal channel in Teams
            connector: teams
            operation: PostMessageToChannelV3
            connectionReference: compliance_TeamsConnection
            inputs:
              teamId: "@{environmentVariables('compliance_TeamsTeamId')}"
              channelId: "@{environmentVariables('compliance_TeamsChannelId')}"
              messageBody:
                type: AdaptiveCard
                version: "1.5"
                body:
                  - type: TextBlock
                    text: "🔴 HIGH RISK document awaiting legal review"
                    weight: Bolder
                    color: Attention
                  - type: TextBlock
                    text: "@{variables('documentName')}"
                  - type: TextBlock
                    text: "Findings: @{substring(variables('findings'), 0, 800)}"
            onFailure: Continue

          - kind: ConditionAction
            name: Was the review approved?
            condition:
              operator: equals
              left: "@{outputs('Request legal review')?['decision']}"
              right: Approve
            trueBranch:
              - kind: SetVariableAction
                name: Mark validated
                inputs:
                  variable: auditStatus
                  value: Approved

              - kind: ConnectorAction
                name: Create remediation task
                connector: sharepointonline
                operation: CreateItem
                connectionReference: compliance_SharePointConnection
                inputs:
                  siteAddress: "@{environmentVariables('compliance_SiteUrl')}"
                  listName: "@{environmentVariables('compliance_RemediationListName')}"
                  item:
                    Title: "Remediate findings in @{variables('documentName')}"
                    DocumentName: "@{variables('documentName')}"
                    RiskLevel: "@{variables('riskLevel')}"
                    Status: Open
                    OwnerEmail: "@{environmentVariables('compliance_RemediationOwnerEmail')}"
                    CreatedDate: "@{utcNow()}"
                    AuditNotes: "@{outputs('Request legal review')?['comments']}"
                onFailure: Continue

            falseBranch:
              - kind: SetVariableAction
                name: Mark returned
                inputs:
                  variable: auditStatus
                  value: Returned

              - kind: ConnectorAction
                name: Notify uploader of return
                onFailure: Continue
                connector: office365
                operation: SendEmailV2
                connectionReference: compliance_OutlookConnection
                inputs:
                  to: "@{triggerOutputs()?['owner']}"
                  subject: "Document returned — @{variables('documentName')}"
                  body: |
                    The legal review returned the document for corrections.

                    Reviewer comments:
                    @{outputs('Request legal review')?['comments']}
            onFailure: Continue

        falseBranch:
          - kind: ConditionAction
            name: Is medium risk?
            condition:
              operator: equals
              left: "@{variables('riskLevel')}"
              right: Medium
            trueBranch:
              - kind: SetVariableAction
                name: Mark remediating
                inputs:
                  variable: auditStatus
                  value: Remediating

              - kind: ConnectorAction
                name: Create remediation task
                connector: sharepointonline
                operation: CreateItem
                connectionReference: compliance_SharePointConnection
                inputs:
                  siteAddress: "@{environmentVariables('compliance_SiteUrl')}"
                  listName: "@{environmentVariables('compliance_RemediationListName')}"
                  item:
                    Title: "Remediate findings in @{variables('documentName')}"
                    DocumentName: "@{variables('documentName')}"
                    RiskLevel: Medium
                    Status: Open
                    Owner: "@{environmentVariables('compliance_RemediationOwnerEmail')}"
                    CreatedDate: "@{utcNow()}"
                onFailure: Continue

            falseBranch: []

      - kind: SetVariableAction
        name: Build audit entry
        inputs:
          variable: auditEntry
          value:
            documentName: "@{variables('documentName')}"
            documentType: "@{triggerOutputs()?['contentType']}"
            riskLevel: "@{variables('riskLevel')}"
            status: "@{variables('auditStatus')}"
            findings: "@{variables('findings')}"
            reviewerEmail: "@{environmentVariables('compliance_LegalReviewerEmail')}"
            reviewedAt: "@{utcNow()}"
            uploadedBy: "@{triggerOutputs()?['owner']}"
            source: "@{triggerOutputs()?['path']}"

      - kind: ConnectorAction
        name: Write audit trail entry
        connector: sharepointonline
        operation: CreateItem
        connectionReference: compliance_SharePointConnection
        inputs:
          siteAddress: "@{environmentVariables('compliance_SiteUrl')}"
          listName: "@{environmentVariables('compliance_AuditListName')}"
          item:
            Title: "@{variables('documentName')}"
            DocumentType: "@{variables('auditEntry')['documentType']}"
            RiskLevel: "@{variables('riskLevel')}"
            Status: "@{variables('auditStatus')}"
            Findings: "@{variables('findings')}"
            UploadedBy: "@{variables('auditEntry')['uploadedBy']}"
            ReviewedAt: "@{variables('auditEntry')['reviewedAt']}"
        onFailure: Continue

      - kind: TerminateAction
        name: End — validation
        status: Succeeded

  - kind: WorkflowDefinition
    id: compliance-review-escalation
    displayName: Compliance — Legal Review Escalation
    description: Recurring check for validation items stuck in Pending Legal Review beyond the target window; nudges the legal reviewer in Teams and by email.
    status: Active
    trigger:
      kind: BuiltInTrigger
      type: Recurrence
      displayName: Daily review escalation
      inputs:
        frequency: Day
        interval: 1
        startTime: "2026-09-02T09:00:00Z"
        timeZone: UTC

    variables:
      - name: pendingItems
        type: Array
        default: []

    actions:
      - kind: ConnectorAction
        name: Get stuck pending reviews
        connector: sharepointonline
        operation: GetItems
        connectionReference: compliance_SharePointConnection
        inputs:
          siteAddress: "@{environmentVariables('compliance_SiteUrl')}"
          listName: "@{environmentVariables('compliance_AuditListName')}"
          filterQuery: "Status eq 'Pending Legal Review'"
          top: 200

      - kind: SetVariableAction
        name: Capture pending items
        inputs:
          variable: pendingItems
          value: "@{outputs('Get stuck pending reviews')?['body/value']}"

      - kind: LoopAction
        name: Escalate each pending review
        type: ApplyToEach
        items: "@{variables('pendingItems')}"
        actions:
          - kind: ConnectorAction
            name: Email legal reviewer reminder
            connector: office365
            operation: SendEmailV2
            connectionReference: compliance_OutlookConnection
            inputs:
              to: "@{environmentVariables('compliance_LegalReviewerEmail')}"
              subject: "[REMINDER] Legal review pending — @{item()?['Title']}"
              body: |
                Document @{item()?['Title']} (risk: @{item()?['RiskLevel']})
                is still pending legal review. Review it in Teams or the audit
                log.
            onFailure: Continue

          - kind: ConnectorAction
            name: Post reminder card to Teams
            connector: teams
            operation: PostMessageToChannelV3
            connectionReference: compliance_TeamsConnection
            inputs:
              teamId: "@{environmentVariables('compliance_TeamsTeamId')}"
              channelId: "@{environmentVariables('compliance_TeamsChannelId')}"
              messageBody:
                type: AdaptiveCard
                version: "1.5"
                body:
                  - type: TextBlock
                    text: "⏰ Legal review still pending"
                    weight: Bolder
                  - type: TextBlock
                    text: "@{item()?['Title']} — @{item()?['RiskLevel']} risk"
            onFailure: Continue

      - kind: TerminateAction
        name: End — review escalation
        status: Succeeded