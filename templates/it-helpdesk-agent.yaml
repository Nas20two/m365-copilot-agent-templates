# Template: cliagent-1.0.0 — M365 Copilot Declarative Agent
kind: BotDefinition
components:
  - kind: BotSettingsComponent
    settings:
      kind: DefaultFeedbackCollection
  - kind: KnowledgeSourceComponent
    displayName: IT-KB-SharePoint
    configuration:
      kind: KnowledgeSourceConfiguration
      source:
        kind: SharePointKnowledgeSource
        siteUrl: https://<COMPANY>.sharepoint.com/sites/IT-Knowledge-Base
        targetKind: Site
entity:
  kind: BotEntity
  displayName: IT Help Desk Agent
  teamsAppInformation:
    kind: ApplicationDetails
    teams:
      kind: TeamsApplicationDetails
      lobDisplayName: IT Help Desk Agent
      shortDescription: Self-service IT support — password reset, software requests, known errors, and escalation routing.
      accentColor: "#0078d4"
  configuration:
    kind: BotConfiguration
    channels:
      - channelId: Microsoft365Copilot
      - channelId: MsTeams
    agentSettings:
      kind: AgentSettings
      version: "1.0"
      model:
        series: claude-opus-5
      instructions:
        segments:
          - kind: StaticSegment
            value: |-
              # Purpose
              Provide IT self-service support for employees — password resets, software access requests,
              known error resolutions, hardware provisioning steps, and escalation routing.

              # General Guidelines
              - Use **only connected knowledge sources** to answer.
              - For password/access issues, provide the exact URL or tool name, never a generic answer.
              - For software requests, list the approval chain and expected SLA in hours.
              - Always include a link to the relevant knowledge article when available.
              - If the issue matches a known error in the KB, include the known-error ID and workaround.
              - If unclear, ask one diagnostic question before escalating.

              # Skills
              ## Password & Access
              - Provide step-by-step for self-service password reset, MFA recovery, and account unlock.
              - Include the helpdesk ticket link if self-service fails.

              ## Software & Hardware Requests
              - List approved software titles. For unapproved software, state the request process.
              - Include hardware refresh eligibility, model options, and ordering SLA.

              ## Known Errors
              - Match the symptom description to the known-error database.
              - Provide the workaround, ETA for permanent fix, and ticket reference.
              - If multiple errors match, list most likely first with confidence level.

              # Error Handling
              - If not in KB: "I can't find that in our documentation yet. I'll create a ticket for the helpdesk."
              - Never guess a technical workaround. Unsourced answers in IT can cause production issues.
      enableMemory: true
      web:
        kind: WebSettings
        enableWebSearch: false
  template: cliagent-1.0.0